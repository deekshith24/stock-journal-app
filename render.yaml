services:
  - type: web
    name: stock-journal-api
    env: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
  - type: web
    name: hf-proxy
    env: node
    buildCommand: cd hf-proxy && npm install
    startCommand: node hf-proxy/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HF_API_TOKEN
        sync: false

  # Backend should point to the proxy if Render cannot resolve Hugging Face directly.
  # After deploying hf-proxy, set HF_PROXY_URL to the proxy URL (e.g. https://hf-proxy.onrender.com)
  # You can set this in Render dashboard or via env var sync; below is a placeholder entry.
  - type: web
    name: stock-journal-api-with-proxy (do-not-deploy)
    envVars:
      - key: HF_PROXY_URL
        value: https://hf-proxy.onrender.com
